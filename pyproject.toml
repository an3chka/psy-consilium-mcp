[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "psy-consilium-mcp"
version = "0.1.0"
description = "Evidence-grounded psychiatric decision-support consilium built on MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=2.1,<3",
  "pydantic>=2.10,<3",
  "streamlit>=1.40,<2",
  "anyio>=4.6,<5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["psy_consilium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

